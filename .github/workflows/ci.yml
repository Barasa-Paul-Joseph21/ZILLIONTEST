name: .NET CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: |
          dotnet restore HYBRIDAPP.Shared/HYBRIDAPP.Shared.csproj
          dotnet restore HYBRIDAPP.Web.Client/HYBRIDAPP.Web.Client.csproj
          dotnet restore HYBRIDAPP.Web/HYBRIDAPP.Web.csproj

      - name: Build projects
        run: |
          dotnet build HYBRIDAPP.Shared/HYBRIDAPP.Shared.csproj --configuration Release --no-restore
          dotnet build HYBRIDAPP.Web.Client/HYBRIDAPP.Web.Client.csproj --configuration Release --no-restore
          dotnet build HYBRIDAPP.Web/HYBRIDAPP.Web.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test HYBRIDAPP.Web/HYBRIDAPP.Web.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true