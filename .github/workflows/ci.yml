name: .NET CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore HYBRIDAPP.sln

      - name: Build solution
        run: dotnet build HYBRIDAPP.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test HYBRIDAPP.sln --configuration Release --no-build --verbosity normal